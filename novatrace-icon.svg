<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none" role="img" aria-label="NovaTrace icon">
  <defs>
    <linearGradient id="traceGrad" x1="8" y1="52" x2="54" y2="12" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#A855F7" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#00F0FF" />
    </linearGradient>
    <filter id="novaGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Outer Orbital Ring (Subtle Tech Frame) -->
  <circle cx="32" cy="32" r="20" stroke="#1E293B" stroke-width="2" stroke-dasharray="4 4" />
  <!-- Secondary Echo Trace -->
  <path d="M14 44 C 22 48, 36 42, 42 26" stroke="#6366F1" stroke-width="2" stroke-linecap="round" opacity="0.45" />
  <!-- Primary Sweeping Trace Path -->
  <path d="M12 48 C 18 22, 28 38, 44 18" stroke="url(#traceGrad)" stroke-width="4" stroke-linecap="round" />
  <!-- Origin Signal Node (Bottom Left) -->
  <circle cx="12" cy="48" r="3.5" fill="#A855F7" />
  <circle cx="12" cy="48" r="1.5" fill="#F8FAFC" />
  <!-- The "Nova" 4-Point Star (Top Right Apex) -->
  <path d="M46 8 C 46 14.5, 47.5 16, 54 16 C 47.5 16, 46 17.5, 46 24 C 46 17.5, 44.5 16, 38 16 C 44.5 16, 46 14.5, 46 8 Z"
        fill="#00F0FF" filter="url(#novaGlow)" />
  <circle cx="46" cy="16" r="2" fill="#FFFFFF" />
</svg>
