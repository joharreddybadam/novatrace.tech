<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="512" height="512" fill="none" class="animate-svg">
  <style>
    @keyframes traceDraw { 0% { stroke-dashoffset: 420; } 55%, 100% { stroke-dashoffset: 0; } }
    @keyframes novaPulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.045); } }
    @keyframes nodePing { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.22); } }
    .trace-line { stroke-dasharray: 420; animation: traceDraw 3.2s cubic-bezier(0.22, 1, 0.36, 1) infinite; }
    .nova-star { transform-origin: 100px 100px; animation: novaPulse 3.2s ease-in-out infinite; }
    .nova-star-offset { transform-origin: 108px 92px; animation: novaPulse 3.2s ease-in-out infinite; }
    .trace-node { transform-box: fill-box; transform-origin: center; animation: nodePing 2.4s ease-in-out infinite; }
  </style>
  <!-- Sweeping Outer Trajectory Trace -->
  <path class="trace-line" d="M 42 158 C 16 112 38 42 104 32" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" />
  <!-- Precision Inner Circuit Trace Wrapping Into Nova Core -->
  <path class="trace-line" d="M 48 164 C 98 182 158 152 166 96" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" />
  <!-- Direct Vector Trace Stem Into Star Center -->
  <path class="trace-line" d="M 42 158 L 86 114" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" />
  <!-- Primary 4-Point Geometric Nova Star -->
  <path class="nova-star-offset" d="M 108 24 C 108 73 127 92 176 92 C 127 92 108 111 108 160 C 108 111 89 92 40 92 C 89 92 108 73 108 24 Z" fill="#FFFFFF" />
  <!-- Contrasting Inner Trace Core Node -->
  <circle cx="108" cy="92" r="4.8999999999999995" fill="#06152D" />
  <!-- Origin Trace Ring Node (Bottom-Left) -->
  <circle class="trace-node" cx="42" cy="158" r="6.6499999999999995" fill="#06152D" stroke="#FFFFFF" stroke-width="4.55" />
  <!-- Satellite Terminal Trace Node (Top-Right) -->
  <circle class="trace-node" cx="156" cy="44" r="5.6000000000000005" fill="#FFFFFF" />
</svg>